# Despliegue gratuito en Render (https://render.com) — "Blueprint".
# La agenda se guarda en una rama del propio repositorio de GitHub, así
# que no hace falta disco de pago: los datos sobreviven a los reinicios.
services:
  - type: web
    name: agenda-barcelona-global
    runtime: node
    branch: claude/barcelona-global-agenda-dashboard-c204e0
    plan: free
    buildCommand: echo "Sin dependencias que instalar"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: COMMS_PASSWORD      # clave de la Dirección de Comunicación
        sync: false              # se escribe en el panel de Render, nunca en el código
      - key: PRESIDENT_PASSWORD  # clave de Presidencia
        sync: false
      - key: GITHUB_TOKEN        # token con permiso de escritura en el repositorio
        sync: false
      - key: GITHUB_REPO
        value: marcsilva111/ester-gravalos
      - key: GITHUB_BRANCH       # rama solo de datos: no dispara despliegues
        value: agenda-datos
  # Para guardar la agenda en Supabase en lugar de GitHub, define estas
  # dos variables en el panel de Render (tienen prioridad sobre GitHub):
  #   SUPABASE_URL  https://<proyecto>.supabase.co
  #   SUPABASE_KEY  la clave service_role del proyecto
  #
  # Para leer solo el calendario de Outlook, define:
  #   OUTLOOK_ICS_URL          el enlace ICS del calendario publicado
  #   OUTLOOK_MARCA            marca de los actos del presidente (por ejemplo *)
  #   OUTLOOK_MARCA_INTERNA    marca del calendario interno de BG (por defecto #)
  #   OUTLOOK_ICS_URL_INTERNO  solo si el calendario interno es otro distinto
