/* =====================================================
   ACCIONES Y SINCRONIZACIÓN SIMULADA
   ===================================================== */
function doAction(act, id){
  const e = byId(id); if (!e) return;
  const finish = (msg) => { saveData(); closeModal(); renderAll(); if (msg) toast(msg, 'ok'); };
  switch (act){
    case 'attend-yes':
      e.attends = 'si';
      finish('Asistencia confirmada.'); break;
    case 'delete':
      confirmDialog('¿Eliminar definitivamente «' + e.title + '»? Esta acción no se puede deshacer: el evento desaparecerá de la base y de la agenda del presidente.', () => {
        // Sus archivos adjuntos se retiran también, para no dejarlos huérfanos
        if (remote.enabled) (e.docs || []).forEach((d) => {
          if (d.fileId) fetch('/api/files/' + encodeURIComponent(d.fileId), { method: 'DELETE', headers: authHeaders() }).catch(() => {});
        });
        events = events.filter(x => x.id !== e.id);
        finish('Evento eliminado definitivamente.');
      }); break;
  }
}

/* =====================================================
   EXPORTACIÓN ICS
   ===================================================== */
function icsEscape(s){ return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsDate(dateStr, timeStr){
  return dateStr.replace(/-/g, '') + 'T' + (timeStr || '09:00').replace(':', '') + '00';
}
function buildICS(list){
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Barcelona Global//Agenda Institucional//ES', 'CALSCALE:GREGORIAN'];
  list.forEach(e => {
    lines.push('BEGIN:VEVENT',
      'UID:' + e.id + '@barcelonaglobal.org',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
      'DTSTART:' + icsDate(e.date, e.start),
      'DTEND:' + icsDate(e.date, e.end || e.start),
      'SUMMARY:' + icsEscape(e.title),
      'LOCATION:' + icsEscape((e.location ? e.location + (e.address ? ', ' + e.address : '') : e.address)),
      'DESCRIPTION:' + icsEscape((e.organizer ? 'Organiza: ' + e.organizer + '. ' : '') +
        (e.speaks ? 'Interviene: ' + (e.speechType || 'sí') + '. ' : '')),
      'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
/* Guarda un archivo. En la página publicada la descarga pasa por el
   visor; en un navegador normal se descarga directamente. */
async function saveFile(filename, text, mime){
  if (window.claude && typeof window.claude.use === 'function'){
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl){
      try { await dl.save({ filename, data: text }); return 'saved'; }
      catch (e) {
        const code = e && e.code;
        if (code === 'declined') return 'declined';
        if (code === 'rejected_extension' || code === 'extension_not_enabled') return 'unsupported';
        if (code === 'rate_limited') return 'busy';
        return 'error';
      }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  return 'saved';
}
async function downloadICS(list, filename){
  if (!list.length){ toast('No hay eventos para exportar.', 'err'); return; }
  const text = buildICS(list);
  const res = await saveFile(filename || 'agenda-barcelona-global.ics', text, 'text/calendar;charset=utf-8');
  if (res === 'saved') toast('Archivo ICS exportado (' + list.length + ' evento' + (list.length === 1 ? '' : 's') + ').', 'ok');
  else if (res === 'declined') { /* la persona ha cancelado */ }
  else if (res === 'busy') toast('Ya hay una descarga esperando confirmación.', 'err');
  else if (res === 'unsupported') showICSText(text, list.length);
  else toast('No se ha podido exportar el archivo.', 'err');
}
/* Aquí no se pueden descargar archivos .ics: se muestra el contenido
   para copiarlo y pegarlo en un archivo o en el calendario. */
function showICSText(text, n){
  showModal('<div class="modal-h"><h3>Agenda en formato ICS</h3><button class="modal-close" data-close>×</button></div>' +
    '<div class="modal-b">' +
      '<p style="font-size:13.5px;color:var(--muted);margin-bottom:10px">Este visor no permite descargar archivos de calendario. Copia el texto y guárdalo como un archivo <b>.ics</b>, o ábrelo desde la versión instalada en vuestro servidor.</p>' +
      '<textarea id="ics-text" readonly style="width:100%;height:210px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:10px">' + esc(text) + '</textarea>' +
    '</div>' +
    '<div class="modal-f"><button class="btn" data-close>Cerrar</button><button class="btn btn-primary" id="ics-copy">Copiar los ' + n + ' eventos</button></div>');
  $('#ics-copy').addEventListener('click', async () => {
    const ta = $('#ics-text');
    try { await navigator.clipboard.writeText(ta.value); toast('Copiado al portapapeles.', 'ok'); }
    catch (e) { ta.select(); toast('Selecciona y copia el texto.', 'err'); }
  });
}

/* =====================================================
   MODALES, CONFIRMACIÓN Y TOASTS
   ===================================================== */
let modalStack = [];
function showModal(inner, stacked){
  const root = $('#modal-root');
  if (!stacked){ root.innerHTML = ''; modalStack = []; }
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal' + (inner.length < 900 && inner.indexOf('ev-form') === -1 ? '' : '') + '">' + inner + '</div>';
  ov.addEventListener('click', (ev) => { if (ev.target === ov) popModal(); });
  root.appendChild(ov);
  modalStack.push(ov);
}
function popModal(){
  const ov = modalStack.pop();
  if (ov) ov.remove();
  flushPendingRender();
}
function closeModal(){
  modalStack.forEach(o => o.remove());
  modalStack = [];
  flushPendingRender();
}
function flushPendingRender(){
  // Cambios recibidos de otras personas mientras había una ficha abierta.
  if (cloud.pendingRender && !modalStack.length){ cloud.pendingRender = false; renderAll(); }
}
function confirmDialog(text, onOk){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
    '<div class="modal narrow">' +
      '<div class="modal-h"><h3>Confirmar acción</h3><button class="modal-close" data-cc>×</button></div>' +
      '<div class="modal-b"><p style="font-size:14.5px">' + esc(text) + '</p></div>' +
      '<div class="modal-f"><button class="btn" data-cc>Volver</button><button class="btn btn-primary" data-ok>Confirmar</button></div>' +
    '</div>';
  ov.addEventListener('click', (ev) => {
    if (ev.target === ov || ev.target.closest('[data-cc]')) { ov.remove(); return; }
    if (ev.target.closest('[data-ok]')) { ov.remove(); onOk(); }
  });
  $('#modal-root').appendChild(ov);
  modalStack.push(ov);
}
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 350); }, 3200);
}

/* =====================================================
   RENDER GLOBAL Y ARRANQUE
   ===================================================== */
function renderAll(){
  applyRole();   // el nivel de acceso puede llegar después de la primera carga
  const pres = state.role === 'president';
  $('#view-president').classList.toggle('hidden', !pres);
  $('#view-comms').classList.toggle('hidden', pres);
  $('#rs-president').classList.toggle('active', pres);
  $('#rs-comms').classList.toggle('active', !pres);
  if (pres){
    $('#p-home').classList.toggle('hidden', state.presTab !== 'home');
    $('#p-calendar').classList.toggle('hidden', state.presTab !== 'calendar');
    $$('#view-president [data-ptab]').forEach(b => b.classList.toggle('active', b.dataset.ptab === state.presTab));
    if (state.presTab === 'home') renderPresident();
    else renderCalendar('p-cal-root', 'pres');
  } else {
    $$('#view-comms [data-ctab]').forEach(b => b.classList.toggle('active', b.dataset.ctab === state.commsTab));
    renderComms();
  }
}

async function init(){
  checkStorage();
  loadAuth();
  await initData();
  initCloud();   // se conecta a la base compartida en cuanto esté disponible
  if (!storageOK && !remote.enabled && !(window.claude && window.claude.use)) $('#storage-banner').classList.remove('hidden');

  // Menú de opciones secundarias y cierre de sesión
  $('#btn-more').addEventListener('click', (ev) => { ev.stopPropagation(); $('#more-menu').classList.toggle('open'); });
  document.addEventListener('click', () => { const m = $('#more-menu'); if (m) m.classList.remove('open'); });
  $('#btn-logout').addEventListener('click', async () => {
    try { await fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: auth.token }) }); } catch (e) {}
    auth = { token: null, role: null };
    saveAuth();
    location.reload();
  });

  // Copia de seguridad / restauración (JSON) para mover los datos entre navegadores
  $('#btn-backup').addEventListener('click', async () => {
    const res = await saveFile('agenda-barcelona-global-datos.json', JSON.stringify(events, null, 2), 'application/json');
    if (res === 'saved') toast('Copia de seguridad guardada.', 'ok');
    else if (res !== 'declined') toast('No se ha podido guardar la copia.', 'err');
  });
  $('#btn-restore').addEventListener('click', () => $('#file-restore').click());
  $('#btn-limpiar-demo').addEventListener('click', limpiarDemo);
  $('#btn-limpiar-outlook').addEventListener('click', limpiarRetirados);
  $('#file-restore').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data) || (data.length && (!data[0].id || !data[0].title))) throw new Error('formato');
        confirmDialog('¿Sustituir los datos actuales por la copia «' + file.name + '» (' + data.length + ' eventos)?', () => {
          events = data; saveData(); renderAll();
          toast('Copia restaurada (' + data.length + ' eventos).', 'ok');
        });
      } catch (e) { toast('El archivo no es una copia válida de la agenda.', 'err'); }
    };
    reader.readAsText(file);
  });

  $('#rs-president').addEventListener('click', () => { state.role = 'president'; renderAll(); });
  $('#rs-comms').addEventListener('click', () => { state.role = 'comms'; renderAll(); });
  $$('#view-president [data-ptab]').forEach(b => b.addEventListener('click', () => { state.presTab = b.dataset.ptab; renderAll(); }));
  $$('#view-comms [data-ctab]').forEach(b => b.addEventListener('click', () => { state.commsTab = b.dataset.ctab; renderAll(); }));
  $$('#seg-ambito button').forEach(b => b.addEventListener('click', () => { state.filters.ambito = b.dataset.ambito; renderAll(); }));

  $('#btn-new').addEventListener('click', () => openEditor(null));
  $('#btn-import').addEventListener('click', async () => {
    const btn = $('#btn-import');
    btn.disabled = true; btn.textContent = '↻ Leyendo Outlook…';
    try {
      const r = await fetch('/api/import', { method: 'POST', headers: authHeaders() });
      if (r.status === 401){ sessionExpired(); return; }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'error');
      remote.outlook = { configurado: true, minutos: data.minutos, ultima: data.ultima };
      const u = data.ultima || {};
      if (!u.ok) toast('No se pudo leer el calendario: ' + (u.error || ''), 'err');
      else {
        const res = u.resumen || {};
        const total = (res.nuevos || 0) + (res.actualizados || 0) + (res.desaparecidos || 0);
        toast(total ? 'Outlook: ' + (res.nuevos || 0) + ' nuevos, ' + (res.actualizados || 0) + ' actualizados.' : 'Outlook: sin novedades.', 'ok');
      }
      // Recoger los eventos actualizados del servidor
      const rr = await fetch('/api/events', { cache: 'no-store', headers: authHeaders() });
      const ev = await rr.json();
      if (Array.isArray(ev.events)){ events = ev.events; remote.version = ev.version; saveLocal(); }
      renderAll();
    } catch (e) { toast('No se pudo sincronizar con Outlook.', 'err'); }
    btn.disabled = false; btn.textContent = '↻ Sincronizar Outlook';
  });
  $('#btn-reset').addEventListener('click', () => confirmDialog('¿Restaurar los datos de demostración? Se perderán los cambios guardados en este navegador.', () => {
    resetData(); renderAll(); toast('Datos de demostración restaurados.', 'ok');
  }));
  $('#btn-export-ics').addEventListener('click', () => {
    const list = state.role === 'president'
      ? events.filter(e => presVisible(e) && isUpcoming(e))
      : filteredEvents();
    downloadICS(list, state.role === 'president' ? 'agenda-presidente.ics' : 'agenda-barcelona-global.ics');
  });

  // Filtros del dashboard de Comunicación
  const F = state.filters;
  $('#f-q').addEventListener('input', (e) => { F.q = e.target.value; renderComms(); });

  // Delegación global de clics (fichas, acciones, documentos, sync…)
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    const open = t.closest('[data-open]');
    const edit = t.closest('[data-edit]');
    const docBtn = t.closest('[data-doc]');
    const fileBtn = t.closest('[data-file]');
    const quitaAdj = t.closest('[data-quita-adj]');
    const act = t.closest('[data-act]');
    const save = t.closest('[data-save]');
    const ics = t.closest('[data-ics]');
    const close = t.closest('[data-close]');
    const irTab = t.closest('[data-ctab-ir]');
    if (irTab){ state.commsTab = irTab.dataset.ctabIr; renderAll(); return; }
    const del = t.closest('[data-del]');
    if (close){ popModal(); return; }
    if (del){ doAction('delete', del.dataset.del); return; }
    if (save){ saveEditor(save.dataset.save || null); return; }
    if (quitaAdj){ adjuntosEnEdicion.splice(Number(quitaAdj.dataset.quitaAdj), 1); pintarAdjuntos(); return; }
    if (fileBtn){ const i = fileBtn.dataset.file.indexOf('|'); abrirAdjunto(fileBtn.dataset.file.slice(0, i), fileBtn.dataset.file.slice(i + 1)); return; }
    if (docBtn){ const [id, kind] = docBtn.dataset.doc.split('|'); openDoc(id, kind); return; }
    if (act){ const [op, id] = act.dataset.act.split('|'); doAction(op, id); return; }
    if (ics){ const e = byId(ics.dataset.ics); if (e) downloadICS([e], 'evento.ics'); return; }
    if (edit){ openEditor(edit.dataset.edit); return; }
    if (open){ openDetail(open.dataset.open); return; }
  });

  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') popModal(); });

  renderAll();
}

document.addEventListener('DOMContentLoaded', init);
</script>
