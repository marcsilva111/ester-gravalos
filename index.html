<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e2dbe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda BG">
<title>Agenda Barcelona Global</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%231e2dbe' stroke-width='11'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial' font-size='46' font-weight='800' fill='%231e2dbe'%3E15%3C/text%3E%3C/svg%3E">
<style>
:root{
  --blue:#1e2dbe;
  --blue-dark:#141f85;
  --blue-soft:#eef0fc;
  --ink:#101a3c;
  --muted:#5c6580;
  --faint:#8d94ab;
  --bg:#f6f7fb;
  --card:#ffffff;
  --line:#e4e7f1;
  --green:#0e7c4f;
  --green-bg:#e7f5ee;
  --amber:#9a6700;
  --amber-bg:#fdf3dc;
  --red:#b3261e;
  --red-bg:#fdecea;
  --violet:#6941c6;
  --violet-bg:#f2edfc;
  --gray-bg:#eef0f4;
  --shadow:0 1px 2px rgba(16,26,60,.06),0 8px 24px -12px rgba(16,26,60,.14);
  --radius:14px;
  --t-propi-bg:#d9efec; --t-propi:#0c5f56;
  --t-inst-bg:#e6dff2;  --t-inst:#5b3fa3;
  --t-extern-bg:#f4dde6; --t-extern:#9c3a63;
  --t-reunio-bg:#fbe3cf; --t-reunio:#a05314;
  --t-collab-bg:#e2f2cf; --t-collab:#4f7710;
  --t-chapter-bg:#fbeebc; --t-chapter:#8a6d0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.2px;color:var(--blue);line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.role-switch{
  margin-left:auto;display:flex;background:var(--blue-soft);border-radius:10px;padding:3px;gap:2px;
}
.role-switch button{
  padding:7px 16px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--blue-dark);white-space:nowrap;
}
.role-switch button.active{background:var(--blue);color:#fff;box-shadow:0 1px 3px rgba(20,31,133,.35)}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;
  font-weight:600;font-size:13.5px;border:1px solid var(--line);background:#fff;color:var(--ink);
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn:hover{background:var(--blue-soft);border-color:#c9d0ee}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn-danger{color:var(--red);border-color:#eec4c1}
.btn-danger:hover{background:var(--red-bg);border-color:#e0a19c}
.btn-ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn-ghost:hover{background:var(--blue-soft)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ico{font-size:14px;line-height:1}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;background:#fff;overflow-x:auto}
.tabs button{
  padding:11px 14px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;
  margin-bottom:-1px;white-space:nowrap;
}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .count{
  display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red-bg);
  color:var(--red);font-size:11px;font-weight:700;text-align:center;
}

.container{max-width:1240px;margin:0 auto;padding:22px 20px 80px}

/* ---------- Badges / chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:20px;
  font-size:11.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
}
.chip-status-valorar{background:var(--gray-bg);color:#4c566d}
.chip-status-pendent{background:var(--amber-bg);color:var(--amber)}
.chip-status-confirmat{background:var(--green-bg);color:var(--green)}
.chip-status-rebutjat{background:var(--red-bg);color:var(--red)}
.chip-status-delegat{background:var(--violet-bg);color:var(--violet)}
.chip-status-cancelat{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.chip-status-finalitzat{background:#e3e9f5;color:#3d548c}
.chip-type{border:1px solid transparent}
.chip-propi{background:var(--t-propi-bg);color:var(--t-propi)}
.chip-inst{background:var(--t-inst-bg);color:var(--t-inst)}
.chip-extern{background:var(--t-extern-bg);color:var(--t-extern)}
.chip-reunio{background:var(--t-reunio-bg);color:var(--t-reunio)}
.chip-collab{background:var(--t-collab-bg);color:var(--t-collab)}
.chip-chapter{background:var(--t-chapter-bg);color:var(--t-chapter)}
.chip-asiste{background:var(--blue);color:#fff}
.chip-interviene{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue)}
.chip-pendiente-p{background:var(--amber-bg);color:var(--amber)}
.chip-sync-none{background:var(--gray-bg);color:#5a6480}
.chip-sync-syncing{background:var(--blue-soft);color:var(--blue)}
.chip-sync-synced{background:var(--green-bg);color:var(--green)}
.chip-sync-pending{background:var(--amber-bg);color:var(--amber)}
.chip-sync-error{background:var(--red-bg);color:var(--red)}
.chip-sync-removed{background:var(--gray-bg);color:#5a6480;text-decoration:line-through}
.chip-prio-alta{background:var(--red-bg);color:var(--red)}
.chip-prio-mitjana{background:var(--amber-bg);color:var(--amber)}
.chip-prio-baixa{background:var(--gray-bg);color:#4c566d}
.chip-outlook{background:#e4edfb;color:#1a4f9c}
.chip-interno{background:#dbe6fb;color:#123a78;border:1px solid #b9cdf2}
/* Los actos internos de Barcelona Global se distinguen por su azul */
tr.row.interno .evt-t{color:#123a78}
.cal-ev.interno,.cal-wev.interno{background:#dbe6fb!important;color:#123a78!important;border-left-color:#3a63b0!important}
.ecard.interno{border-left:3px solid #3a63b0}
.sync-info{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-left:auto}
.sync-info.err{color:var(--red);font-weight:600}
.dot-warn{color:var(--amber);font-size:14px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.chip-sync-syncing{animation:pulse 1s infinite}

/* ---------- Alerts ---------- */
.alert{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:13px;
  background:var(--amber-bg);color:var(--amber);border:1px solid #f2dfae;font-weight:600;
}
.alert.info{background:var(--blue-soft);color:var(--blue-dark);border-color:#ccd3f4}
.alert.danger{background:var(--red-bg);color:var(--red);border-color:#efc6c3}
.alert .when{font-weight:500;opacity:.75;font-size:12px;margin-left:auto;white-space:nowrap}
.storage-banner{
  background:var(--amber-bg);color:var(--amber);border-bottom:1px solid #f2dfae;
  padding:9px 20px;font-size:13px;font-weight:600;display:flex;gap:9px;align-items:center;
}

/* ---------- Menú desplegable (acciones secundarias) ---------- */
.menu{position:relative}
.menu-list{
  position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow);display:none;min-width:210px;z-index:55;padding:5px;
}
.menu.open .menu-list{display:block}
.menu-list button{
  display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);
}
.menu-list button:hover{background:var(--blue-soft)}

/* ---------- Punto de prioridad ---------- */
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pdot-alta{background:var(--red)}
.pdot-mitjana{background:var(--amber)}
.pdot-baixa{background:#c6cbd9}

/* ---------- Pantalla de acceso ---------- */
.login-wrap{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:36px 32px;max-width:390px;width:100%;text-align:center;display:grid;gap:14px;
}
.login-card h2{font-size:20px;letter-spacing:-.3px;color:var(--blue-dark)}
.login-card p{font-size:13.5px;color:var(--muted)}
.login-card input{
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;text-align:center;width:100%;
}
.login-card input:focus{outline:2px solid rgba(30,45,190,.25);border-color:var(--blue)}
.login-card .btn{justify-content:center;padding:11px}
.login-err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
.login-note{font-size:12px;color:var(--faint)}

/* ---------- President hero ---------- */
.hero{
  background:linear-gradient(135deg,var(--blue-dark),var(--blue) 70%);color:#fff;border-radius:18px;
  padding:26px 28px;box-shadow:var(--shadow);margin-bottom:26px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
  border:34px solid rgba(255,255,255,.07);
}
.hero-label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;opacity:.75;margin-bottom:8px}
.hero h2{font-size:26px;letter-spacing:-.4px;line-height:1.2;margin-bottom:6px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14.5px;opacity:.95;margin-bottom:14px}
.hero-meta span{display:inline-flex;gap:7px;align-items:center}
.hero-badges{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.hero-badges .chip{font-size:12px;padding:4px 12px}
.hero-badges .chip-asiste{background:#fff;color:var(--blue-dark)}
.hero-badges .chip-interviene{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.6)}
.hero-countdown{
  position:absolute;right:28px;top:24px;text-align:right;
}
.hero-countdown .cd-num{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.hero-countdown .cd-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;opacity:.7;font-weight:600}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero-actions .btn{background:#fff;border-color:#fff;color:var(--blue-dark)}
.hero-actions .btn:hover{background:var(--blue-soft)}
.hero-actions .btn.outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hero-actions .btn.outline:hover{background:rgba(255,255,255,.12)}
.hero-alerts{margin-top:16px;display:grid;gap:8px;position:relative;z-index:1}
.hero-alerts .alert{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)}
.hero-empty{font-size:16px;opacity:.9}

/* ---------- Section blocks ---------- */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.block-h{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
}
.block-h h3{font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--blue-dark)}
.block-h .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--faint)}
.block-body{padding:10px 12px;display:grid;gap:8px}
.block-empty{padding:18px 16px;color:var(--faint);font-size:13.5px;text-align:center}

/* ---------- Event cards ---------- */
.ecard{
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;cursor:pointer;
  display:grid;grid-template-columns:52px 1fr;gap:12px;transition:border-color .12s, box-shadow .12s;
}
.ecard:hover{border-color:var(--blue);box-shadow:0 2px 10px -4px rgba(30,45,190,.25)}
.ecard.dim{opacity:.62}
.ecard-date{
  text-align:center;border-right:1px solid var(--line);padding-right:10px;align-self:start;
}
.ecard-date .d{font-size:20px;font-weight:800;line-height:1.05;color:var(--blue)}
.ecard-date .m{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.ecard-date .t{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.ecard-main{min-width:0}
.ecard-title{font-weight:700;font-size:14.5px;letter-spacing:-.1px;margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ecard-place{font-size:12.5px;color:var(--muted);margin-bottom:7px;display:flex;gap:5px;align-items:center}
.ecard-tags{display:flex;gap:5px;flex-wrap:wrap}
.ecard-alert{margin-top:7px;font-size:12px;color:var(--amber);font-weight:600;display:flex;gap:5px;align-items:center}

/* ---------- Calendar ---------- */
.cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-toolbar h3{font-size:19px;letter-spacing:-.3px;min-width:190px;text-transform:capitalize}
.cal-nav{display:flex;gap:4px}
.cal-nav .btn{padding:6px 11px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2.5px;gap:2px}
.seg-ambito{flex:none}
.seg-ambito button[data-ambito="interno"].active{background:#3a63b0}
.seg button{padding:5.5px 13px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.active{background:var(--blue);color:#fff}
.cal-filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.fchip{
  padding:4.5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--muted);
}
.fchip.active{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
}
.cal-dow{background:#f0f2f8;padding:8px 6px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.cal-cell{background:#fff;min-height:104px;padding:6px;position:relative;min-width:0;overflow:hidden}
.cal-cell.out{background:#fafbfd}
.cal-cell .dn{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cal-cell.out .dn{color:#c2c7d6}
.cal-cell.today .dn{
  background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
}
.cal-ev{
  display:block;width:100%;max-width:100%;text-align:left;font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:6px;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid transparent;color:var(--ink);
}
.cal-ev:hover{filter:brightness(.95)}
.cal-ev.pres{border-left-color:var(--blue);box-shadow:inset 0 0 0 1px rgba(30,45,190,.25)}
.cal-ev .w{color:var(--amber)}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cal-wday{background:#fff;border:1px solid var(--line);border-radius:11px;min-height:150px;padding:9px;min-width:0}
.cal-wday.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cal-wday-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.cal-wday.today .cal-wday-h{color:var(--blue)}
.cal-wev{
  display:block;width:100%;text-align:left;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px;border-left:3px solid transparent;color:var(--ink);
}
.cal-wev.pres{border-left-color:var(--blue)}
.cal-wev b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.cal-wev .tm{font-weight:700;font-size:11px;opacity:.75}
.cal-agenda{display:grid;gap:8px}
.cal-agenda-day{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--blue-dark);margin:12px 2px 2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- Comms toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;
}
.search input{border:none;outline:none;flex:1;background:transparent;font-size:14px;min-width:0}
.toolbar select,.toolbar input[type=date]{
  border:1px solid var(--line);border-radius:9px;padding:7.5px 10px;background:#fff;font-size:13px;color:var(--ink)
}

/* ---------- Table ---------- */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
th{
  text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  border-bottom:1px solid var(--line);background:#fafbfe;white-space:nowrap;position:sticky;top:0;
}
td{padding:9px 12px;border-bottom:1px solid #eef0f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row:hover td{background:#fafbff}
td .evt-t{font-weight:700;cursor:pointer}
td .evt-t:hover{color:var(--blue)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.iconbtn{
  width:29px;height:29px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);
}
.iconbtn:hover{background:var(--blue-soft);color:var(--blue)}
.iconbtn.danger:hover{background:var(--red-bg);color:var(--red)}


/* ---------- Incidents ---------- */
.inc-list{display:grid;gap:10px}
.inc{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:11px;
  padding:13px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);
}
.inc.sev-high{border-left-color:var(--red)}
.inc .inc-ico{font-size:19px;line-height:1.2}
.inc b{display:block;margin-bottom:2px}
.inc p{font-size:13px;color:var(--muted)}
.inc .btn{margin-left:auto;flex:none;align-self:center}
.inc-ok{
  background:var(--green-bg);border:1px solid #cbe7d8;color:var(--green);border-radius:11px;padding:16px;text-align:center;font-weight:600;
}

/* ---------- Modals ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,26,60,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;
  padding:4vh 14px;overflow-y:auto;backdrop-filter:blur(2px);
}
.modal{
  background:#fff;border-radius:16px;max-width:760px;width:100%;box-shadow:0 24px 60px -12px rgba(16,26,60,.4);
  animation:mIn .16s ease-out;margin-bottom:6vh;
}
@keyframes mIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal.narrow{max-width:460px}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 0}
.modal-h h3{font-size:19px;letter-spacing:-.3px;line-height:1.25}
.modal-close{margin-left:auto;font-size:20px;color:var(--faint);width:32px;height:32px;border-radius:8px;flex:none}
.modal-close:hover{background:var(--gray-bg);color:var(--ink)}
.modal-b{padding:14px 22px 22px}
.modal-f{display:flex;gap:9px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end;background:#fafbfe;border-radius:0 0 16px 16px}

/* detail sheet */
.dsec{margin-bottom:16px}
.dsec h4{
  font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin-bottom:8px;font-weight:800;
  border-bottom:1px solid var(--line);padding-bottom:5px;
}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px 18px}
.dit{font-size:13.5px}
.dit .k{display:block;font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dit .v{font-weight:600}
.doc-row{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:13.5px;background:#fafbfe;
}
.doc-row .btn{margin-left:auto}
.changes-list{display:grid;gap:6px}

/* ---------- Forms ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;background:#fff;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid rgba(30,45,190,.25);border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:56px}
.fset{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.fset legend{font-size:12px;font-weight:800;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.8px;padding:0 6px}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(420px,92vw)}
.toast{
  background:var(--ink);color:#fff;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px -8px rgba(16,26,60,.5);display:flex;gap:9px;align-items:center;animation:mIn .18s ease-out;
}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}


/* ---------- La tabla se vuelve fichas en el móvil ---------- */
@media (max-width:700px){
  .table-wrap{border:none;background:transparent;box-shadow:none;overflow:visible}
  table{min-width:0}
  thead{display:none}
  tbody{display:grid;gap:10px}
  tr.row{
    display:block;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;box-shadow:var(--shadow);
  }
  tr.row:hover td{background:transparent}
  td{display:block;border:none;padding:0}
  .c-fecha{font-size:12.5px;color:var(--blue);font-weight:700;margin-bottom:3px}
  .c-fecha br{display:none}
  .c-fecha small{color:var(--muted)!important}
  .c-fecha small::before{content:" · "}
  .c-evento{margin-bottom:10px}
  .c-evento .evt-t{font-size:15px}
  .c-acciones{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}
  .row-actions{justify-content:space-around}
  .iconbtn{width:40px;height:40px;font-size:17px}
  /* una sola fila vacía ocupa toda la ficha */
  tbody tr:not(.row) td{display:block;text-align:center;padding:24px 0}
}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .cal-week{grid-template-columns:1fr;gap:8px}
  .cal-wday{min-height:0}
  .hero-countdown{position:static;text-align:left;margin-bottom:12px}
  .fgrid{grid-template-columns:1fr}
}
@media (max-width:640px){

  .toolbar #btn-new,.toolbar #btn-import{order:2;flex:1;justify-content:center}
  .topbar{padding:9px 12px;gap:10px}

.lnk{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.cal-grid-mobilenote{display:none;color:var(--muted);font-size:13px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}

/* ---------- Persistencia (local + backend compartido) ----------
   Si la página se sirve desde el servidor (server.js), los datos
   viven en una base común: todos los navegadores ven lo mismo y
   se actualizan solos. Abierta como archivo suelto, funciona en
   modo local con localStorage, como antes. */
/* ---------- Capa online (página publicada en claude.ai) ----------
   Cuando la agenda se abre como página publicada, los eventos viven
   en una base compartida en tiempo real. Quien tiene permiso de
   edición (Comunicación) escribe; quien solo puede ver (Presidencia)
   consulta. Fuera de ahí, el archivo sigue funcionando igual. */
const cloud = { db: null, ready: false, canWrite: false, seeded: false, lastSent: {}, pendingRender: false, error: null };

function cloudActive(){ return cloud.ready; }
function isReadOnly(){
  if (cloud.ready) return !cloud.canWrite;
  if (remote.enabled) return auth.role === 'president';
  return false;
}
async function initCloud(){
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) return;
  cloud.db = db;

  // ¿Puede escribir esta persona? Una reserva breve lo revela sin tocar los datos.
  try {
    await db.doc('meta/acceso').acquire({ holder: 'sesion', ttlMs: 1000 });
    cloud.canWrite = true;
  } catch (e) { cloud.canWrite = false; }

  db.collection('events').onSnapshot((snap) => {
    const list = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    if (!list.length && !cloud.ready && cloud.canWrite && !cloud.seeded){ seedCloud(); return; }
    events = list;
    rememberSent();
    cloud.ready = true; cloud.error = null;
    saveLocal();
    refreshFromCloud();
  }, (err) => {
    cloud.error = err && err.code === 'revoked' ? 'Tu acceso a la agenda ha cambiado.' : 'Se ha perdido la conexión con la agenda compartida.';
    updateConnBadge();
  });
}
function refreshFromCloud(){
  if (modalStack.length){ cloud.pendingRender = true; }
  else { renderAll(); }
  updateConnBadge();
}
function rememberSent(){
  cloud.lastSent = {};
  events.forEach(e => { cloud.lastSent[e.id] = JSON.stringify(e); });
}
async function seedCloud(){
  cloud.seeded = true;
  try {
    const lease = await cloud.db.doc('meta/seed').acquire({ holder: 'siembra-' + Math.random().toString(36).slice(2, 8), ttlMs: 20000 });
    if (!lease.acquired) return;               // otra persona la está creando
    const check = await cloud.db.collection('events').limit(1).get();
    if (!check.empty) return;
    const seed = seedEvents();
    await Promise.all(seed.map(e => cloud.db.doc('events/' + e.id).set(e)));
  } catch (e) { /* sin permiso de escritura: se queda en modo consulta */ }
}
async function pushCloud(){
  if (!cloud.db || !cloud.canWrite) return;
  const now = {};
  events.forEach(e => { now[e.id] = JSON.stringify(e); });
  const ops = [];
  Object.keys(now).forEach(id => {
    if (now[id] !== cloud.lastSent[id]) ops.push(cloud.db.doc('events/' + id).set(byId(id)));
  });
  Object.keys(cloud.lastSent).forEach(id => {
    if (!(id in now)) ops.push(cloud.db.doc('events/' + id).delete());
  });
  if (!ops.length) return;
  cloud.lastSent = now;
  try { await Promise.all(ops); }
  catch (e) {
    const quota = e && e.code === 'quota_exceeded';
    toast(quota ? 'La agenda ha alcanzado su capacidad: archiva o elimina eventos antiguos.' : 'No se han podido guardar los cambios en la agenda compartida.', 'err');
    cloud.lastSent = {}; // fuerza el reenvío en el próximo guardado
  }
}

let events = [];
let storageOK = true;
const remote = { enabled: false, online: false, version: 0, pushTimer: null, pushing: false, dirty: false, pollStarted: false };

/* ---------- Sesión y roles ---------- */
const AUTH_KEY = 'bg-auth-v1';
let auth = { token: null, role: null };
function loadAuth(){
  try { const raw = localStorage.getItem(AUTH_KEY); if (raw) auth = JSON.parse(raw); } catch (e) {}
}
function saveAuth(){
  try {
    if (auth.token) localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    else localStorage.removeItem(AUTH_KEY);
  } catch (e) {}
}
function authHeaders(extra){
  const h = Object.assign({}, extra || {});
  if (auth.token) h['Authorization'] = 'Bearer ' + auth.token;
  return h;
}
function canEdit(){ return !isReadOnly(); }
function applyRole(){
  const presOnly = isReadOnly();
  if (presOnly) state.role = 'president';
  const sw = $('.role-switch'); if (sw) sw.classList.toggle('hidden', presOnly);
  // El presidente no tiene menú de opciones: su pantalla es solo de consulta.
  const mm = $('#more-menu'); if (mm) mm.classList.toggle('hidden', presOnly);
  ['#btn-backup', '#btn-restore', '#btn-reset', '#btn-limpiar-demo', '#btn-limpiar-outlook'].forEach((sel) => {
    const b = $(sel); if (b) b.classList.toggle('hidden', presOnly);
  });
  // Con la agenda en marcha, «restaurar la demostración» sería destructivo:
  // en su lugar se ofrece vaciar los ejemplos que quedan.
  const enServicio = remote.enabled || cloud.ready;
  const reset = $('#btn-reset'); if (reset && !presOnly) reset.classList.toggle('hidden', enServicio);
  const limpiar = $('#btn-limpiar-demo');
  if (limpiar && !presOnly) limpiar.classList.toggle('hidden', !enServicio || !events.some(esDemo));
  const limpiarOl = $('#btn-limpiar-outlook');
  if (limpiarOl && !presOnly) limpiarOl.classList.toggle('hidden', !events.some(esRetirado));
  const lo = $('#btn-logout'); if (lo) lo.classList.toggle('hidden', !(remote.enabled && auth.token));
}
function showLogin(msg){
  let w = $('#login-screen');
  if (!w){
    w = document.createElement('div');
    w.id = 'login-screen'; w.className = 'login-wrap';
    w.innerHTML =
      '<form class="login-card" id="login-form">' +
        '<div style="display:flex;justify-content:center">' +
          '<svg width="64" height="64" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#1e2dbe" stroke-width="11"/><text x="50" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#1e2dbe">15</text></svg>' +
        '</div>' +
        '<h2>Barcelona Global<br>Agenda Institucional</h2>' +
        '<p>Introduce tu clave de acceso para continuar.</p>' +
        '<input type="password" id="login-pass" placeholder="Clave de acceso" autocomplete="current-password" autofocus>' +
        '<div class="login-err" id="login-err"></div>' +
        '<button class="btn btn-primary" type="submit">Entrar</button>' +
        '<p class="login-note">Comunicación: gestión completa · Presidencia: consulta</p>' +
      '</form>';
    document.body.appendChild(w);
    $('#login-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const pass = $('#login-pass').value;
      if (!pass) return;
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pass }) });
        if (!r.ok){ $('#login-err').textContent = 'Clave incorrecta.'; $('#login-pass').select(); return; }
        const data = await r.json();
        auth = { token: data.token, role: data.role };
        saveAuth();
        w.remove();
        await initData();
        renderAll();
        toast(data.role === 'comms' ? 'Sesión iniciada: Comunicación (edición completa).' : 'Sesión iniciada: Presidencia (consulta).', 'ok');
      } catch (e) { $('#login-err').textContent = 'No se pudo contactar con el servidor.'; }
    });
  }
  if (msg) $('#login-err').textContent = msg;
  const inp = $('#login-pass'); if (inp) inp.focus();
}
function sessionExpired(){
  auth = { token: null, role: null };
  saveAuth();
  showLogin('La sesión ha caducado. Vuelve a introducir tu clave.');
}

function checkStorage(){
  try {
    localStorage.setItem(LS_KEY + '-test', '1');
    localStorage.removeItem(LS_KEY + '-test');
    storageOK = true;
  } catch (e) { storageOK = false; }
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* localStorage no disponible o datos corruptos */ }
  return null;
}
function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(events)); } catch (e) { /* sin persistencia local */ }
}
async function initData(){
  // Publicada en claude.ai: los datos llegan por la base compartida, sin clave.
  const published = !!(window.claude && typeof window.claude.use === 'function');
  const isHTTP = !published && (location.protocol === 'http:' || location.protocol === 'https:');
  if (isHTTP){
    try {
      const r = await fetch('/api/events', { cache: 'no-store', headers: authHeaders() });
      if (r.status === 401 || r.status === 403){
        remote.enabled = true; remote.online = true;
        auth = { token: null, role: null }; saveAuth();
        updateConnBadge(); applyRole(); showLogin();
        return;
      }
      if (r.ok){
        const data = await r.json();
        remote.enabled = true; remote.online = true;
        if (data.role) auth.role = data.role;
        if (data.outlook) remote.outlook = data.outlook;
        if (data && Array.isArray(data.events)){
          events = data.events;
          remote.version = data.version || 0;
          saveLocal();
        } else {
          // Servidor recién estrenado: se siembra con los datos locales o de demo.
          events = loadLocal() || seedEvents();
          saveLocal();
          if (auth.role === 'comms') await pushRemote();
        }
        if (!remote.pollStarted){ setInterval(pollRemote, 4000); remote.pollStarted = true; }
        updateConnBadge(); applyRole();
        return;
      }
    } catch (e) { /* sin API: modo local */ }
  }
  events = loadLocal();
  if (!events){ events = seedEvents(); saveLocal(); }
  updateConnBadge(); applyRole();
}
function saveData(){
  saveLocal();
  if (cloud.ready){ pushCloud(); return; }
  if (remote.enabled && auth.role === 'comms'){
    remote.dirty = true;
    clearTimeout(remote.pushTimer);
    remote.pushTimer = setTimeout(pushRemote, 350);
  }
}
async function pushRemote(){
  if (!remote.enabled || remote.pushing) return;
  remote.pushing = true; remote.dirty = false;
  try {
    const r = await fetch('/api/events', {
      method: 'PUT',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ events }),
    });
    if (r.status === 401){ remote.pushing = false; sessionExpired(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    remote.version = data.version || remote.version + 1;
    if (!remote.online){ remote.online = true; toast('Conexión recuperada: cambios guardados en la base común.', 'ok'); }
    remote.online = true;
  } catch (e) {
    remote.online = false; remote.dirty = true;
    clearTimeout(remote.pushTimer);
    remote.pushTimer = setTimeout(pushRemote, 5000); // reintento
  }
  remote.pushing = false;
  updateConnBadge();
}
async function pollRemote(){
  if (!remote.enabled || remote.dirty || remote.pushing || !auth.token) return;
  try {
    const r = await fetch('/api/version', { cache: 'no-store', headers: authHeaders() });
    if (r.status === 401){ sessionExpired(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const v = (await r.json()).version || 0;
    remote.online = true;
    if (v > remote.version && modalStack.length === 0){
      const rr = await fetch('/api/events', { cache: 'no-store', headers: authHeaders() });
      const data = await rr.json();
      if (data && Array.isArray(data.events)){
        events = data.events;
        remote.version = data.version || v;
        saveLocal();
        renderAll();
      }
    }
  } catch (e) { remote.online = false; }
  updateConnBadge();
}
function updateConnBadge(){
  const b = $('#conn-badge');
  if (!b) return;
  if (cloud.ready){
    if (cloud.error){ b.className = 'chip chip-sync-pending'; b.textContent = '● Sin conexión'; b.title = cloud.error; return; }
    b.className = 'chip chip-sync-synced';
    b.textContent = cloud.canWrite ? '● Agenda compartida' : '● Solo consulta';
    b.title = cloud.canWrite
      ? 'Conectado: todos los usuarios ven los mismos datos al instante.'
      : 'Tu acceso es de consulta. La directora de Comunicación mantiene la agenda.';
    return;
  }
  if (!remote.enabled){ b.className = 'chip chip-sync-none'; b.textContent = '● Solo este navegador'; b.title = 'Abre la página a través del servidor (node server.js) para compartir los datos.'; return; }
  if (remote.online){ b.className = 'chip chip-sync-synced'; b.textContent = '● Base compartida'; b.title = 'Conectado al servidor: todos los usuarios ven los mismos datos.'; }
  else { b.className = 'chip chip-sync-pending'; b.textContent = '● Sin conexión'; b.title = 'No se puede contactar con el servidor. Los cambios se guardan localmente y se reintentará.'; }
}
function resetData(){
  events = seedEvents();
  saveData();
}

/* ---------- Utilidades ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid(){ return 'ev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function todayISO(){ const d = new Date(); return d.toISOString().slice(0, 10); }
function parseDT(dateStr, timeStr){
  const [y, m, d] = (dateStr || todayISO()).split('-').map(Number);
  const [hh, mm] = (timeStr || '00:00').split(':').map(Number);
  return new Date(y, m - 1, d, hh || 0, mm || 0);
}
function evStart(ev){ return parseDT(ev.date, ev.start); }
function evEnd(ev){ return parseDT(ev.date, ev.end || ev.start); }
function fmtDateLong(dateStr){
  const d = parseDT(dateStr, '00:00');
  return DOWS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
}
function fmtDateShort(dateStr){
  const d = parseDT(dateStr, '00:00');
  return DOWS_S[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTHS_S[d.getMonth()];
}
function fmtTimeRange(ev){
  if (!ev.start) return 'Hora por confirmar';
  return ev.start + (ev.end ? ' – ' + ev.end : '') + ' h';
}
function fmtRelative(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diff / 3.6e6);
  if (h < 1) return 'hace unos minutos';
  if (h < 24) return 'hace ' + h + ' h';
  const d = Math.floor(h / 24);
  return d === 1 ? 'ayer' : 'hace ' + d + ' días';
}
function isUpcoming(ev){ return evEnd(ev) >= new Date(); }
function isActive(ev){ return !ev.missingFromSource; }
function presVisible(ev){
  // Llega a su agenda salvo que Comunicación lo descarte o el acto haya
  // dejado de venir del calendario de Outlook.
  return !ev.internal && ev.attends !== 'no' && !ev.missingFromSource;
}
function hasDoc(ev, kind){ return (ev.docs || []).some(d => d.kind === kind); }
function recentChanges(ev, days){
  const lim = Date.now() - (days || 7) * 864e5;
  return (ev.changes || []).filter(c => new Date(c.ts).getTime() >= lim);
}
function overlap(a, b){
  if (a.date !== b.date || !a.start || !b.start) return false;
  return evStart(a) < evEnd(b) && evStart(b) < evEnd(a);
}
function findOverlaps(list){
  const res = [];
  for (let i = 0; i < list.length; i++)
    for (let j = i + 1; j < list.length; j++)
      if (overlap(list[i], list[j])) res.push([list[i], list[j]]);
  return res;
}
function hasOverlap(ev){
  return events.some(o => o.id !== ev.id && presVisible(o) && presVisible(ev) && overlap(o, ev));
}
function byId(id){ return events.find(e => e.id === id); }
function logChange(ev, message){
  ev.changes = ev.changes || [];
  ev.changes.unshift({ ts: new Date().toISOString(), message });
}

/* ---------- Incidencias ---------- */
function computeIncidents(){
  const incs = [];
  const active = events.filter(e => isActive(e) && isUpcoming(e));
  const presEvents = active.filter(e => !e.internal && e.attends !== 'no');
  findOverlaps(presEvents).forEach(([a, b]) => {
    incs.push({ sev: 'high', ico: '⏱', title: 'Eventos solapados en la agenda del presidente',
      text: '«' + a.title + '» (' + fmtTimeRange(a) + ') coincide con «' + b.title + '» (' + fmtTimeRange(b) + ') el ' + fmtDateShort(a.date) + '.', evId: a.id });
  });
  active.forEach(e => {
    if (!e.internal && e.attends === 'si' && e.speaks && !(e.docs || []).some(d => d.fileId))
      incs.push({ sev: 'mid', ico: '📄', title: 'Intervención sin briefing',
        text: 'El presidente interviene en «' + e.title + '» (' + fmtDateShort(e.date) + ') y todavía no se ha adjuntado ningún documento.', evId: e.id });
    if (e.attends !== 'no' && !e.location && !e.address)
      incs.push({ sev: 'mid', ico: '📍', title: 'Evento sin ubicación',
        text: '«' + e.title + '» (' + fmtDateShort(e.date) + ') no tiene ubicación definida.', evId: e.id });
    const daysTo = (evStart(e) - Date.now()) / 864e5;
    if (daysTo >= 0 && daysTo <= 7 && recentChanges(e, 3).length)
      incs.push({ sev: 'high', ico: '⚠️', title: 'Cambio importante cerca de la fecha',
        text: '«' + e.title + '» se celebra en menos de 7 días y ha registrado cambios recientes: ' + recentChanges(e, 3)[0].message, evId: e.id });
  });
  return incs;
}
/* ---------- Estado de interfaz ---------- */
const state = {
  role: 'president',            // president | comms
  presTab: 'home',              // home | calendar
  commsTab: 'table',            // table | cards | calendar | incidents
  cal: { date: new Date(), mode: 'month', onlySpeaks: false },
  filters: { q: '', ambito: 'todo' },   // todo | pres | interno
};

/* ---------- Fragmentos reutilizables ---------- */
function chipType(ev){ return '<span class="chip chip-type chip-' + ev.type + '">' + esc(TYPES[ev.type].label) + '</span>'; }
function chipsParticipation(ev, simple){
  let h = '';
  // Al presidente no se le informa de su propia asistencia: todo lo que
  // aparece en su agenda son actos a los que va.
  if (!simple){
    if (ev.attends === 'si') h += '<span class="chip chip-asiste">Asiste</span>';
    else if (ev.attends === 'pendent') h += '<span class="chip chip-pendiente-p">Asistencia pendiente</span>';
  }
  if (ev.attends !== 'no' && ev.speaks) h += '<span class="chip chip-interviene">🎤 Interviene</span>';
  return h;
}
function typeColorVars(ev){
  return 'background:var(--t-' + ev.type + '-bg);color:var(--t-' + ev.type + ')';
}

function eventCard(ev, opts){
  opts = opts || {};
  const alerts = recentChanges(ev, 7);
  const dt = parseDT(ev.date, '00:00');
  // En modo "simple" (agenda del presidente) solo se etiqueta lo excepcional:
  // lo confirmado y con asistencia es la norma y no necesita chip.
  const tags = [];
  if (ev.internal){
    if (state.filters.ambito !== 'interno')
      tags.push('<span class="chip chip-interno" title="Acto interno de Barcelona Global: el presidente no lo ve">Interno BG</span>');
  } else {
    if (!opts.simple){
      if (ev.attends === 'pendent') tags.push('<span class="chip chip-pendiente-p">Asistencia pendiente</span>');
      else if (ev.attends === 'si') tags.push('<span class="chip chip-asiste">Asiste</span>');
    }
    if (ev.attends !== 'no' && ev.speaks)
      tags.push('<span class="chip chip-interviene">🎤 ' + esc(ev.speechType || 'Interviene') +
        (ev.speechDuration && ev.speechDuration !== '—' ? ' · ' + esc(ev.speechDuration) : '') + '</span>');
  }
  if (opts.showType) tags.push(chipType(ev));
  if (opts.showType && ev.origin === 'outlook') tags.push('<span class="chip chip-outlook">Outlook</span>');
  return '<div class="ecard' + (ev.internal ? ' interno' : '') + (ev.missingFromSource ? ' dim' : '') + '" data-open="' + ev.id + '">' +
    '<div class="ecard-date">' +
      '<div class="d">' + dt.getDate() + '</div>' +
      '<div class="m">' + MONTHS_S[dt.getMonth()] + '</div>' +
      '<div class="t">' + (ev.start ? esc(ev.start) : '—') + '</div>' +
    '</div>' +
    '<div class="ecard-main">' +
      '<div class="ecard-title">' + esc(ev.title) + (hasOverlap(ev) && isUpcoming(ev) ? ' <span class="dot-warn" title="Se solapa con otro evento">⏱</span>' : '') + '</div>' +
      '<div class="ecard-place">📍 ' + esc(ev.location || 'Ubicación por confirmar') + '</div>' +
      (tags.length ? '<div class="ecard-tags">' + tags.join('') + '</div>' : '') +
      (alerts.length ? '<div class="ecard-alert">⚠️ ' + esc(alerts[0].message) + '</div>' : '') +
    '</div>' +
  '</div>';
}

/* =====================================================
   VISTA DEL PRESIDENTE
   ===================================================== */
function renderPresident(){
  renderHero();
  const list = events.filter(presVisible).sort((a, b) => evStart(a) - evStart(b));
  const now = new Date();
  const in7 = new Date(now.getTime() + 7 * 864e5);

  // Todo lo que llega a su agenda son actos a los que va: se reparten
  // por cercanía, sin dejar ninguno fuera.
  const week = list.filter(e => isUpcoming(e) && evStart(e) <= in7);
  const upcoming = list.filter(e => isUpcoming(e) && evStart(e) > in7);

  fillList('list-week', 'n-week', week, 'Sin compromisos esta semana.');
  fillList('list-upcoming', 'n-upcoming', upcoming.slice(0, 10), 'Sin próximos compromisos.');
}
function fillList(bodyId, nId, list, emptyMsg){
  $('#' + nId).textContent = list.length || '';
  $('#' + bodyId).innerHTML = list.length ? list.map(e => eventCard(e, { simple: true })).join('') : '<div class="block-empty">' + emptyMsg + '</div>';
}

let heroTimer = null;
function renderHero(){
  const root = $('#p-hero');
  const next = events.filter(e => presVisible(e) && isUpcoming(e))
    .sort((a, b) => evStart(a) - evStart(b))[0];
  if (!next){
    root.innerHTML = '<div class="hero"><div class="hero-label">Próximo compromiso</div><p class="hero-empty">No hay compromisos confirmados en la agenda.</p></div>';
    return;
  }
  const alerts = recentChanges(next, 7);
  const adjunto = (next.docs || []).find(d => d.fileId);
  const briefing = (next.docs || []).find(d => d.kind === 'briefing');
  root.innerHTML =
    '<div class="hero">' +
      '<div class="hero-countdown"><div class="cd-num" id="cd-num"></div><div class="cd-lbl" id="cd-lbl"></div></div>' +
      '<div class="hero-label">Próximo compromiso</div>' +
      '<h2>' + esc(next.title) + '</h2>' +
      '<div class="hero-meta">' +
        '<span>📅 ' + esc(fmtDateLong(next.date)) + '</span>' +
        '<span>🕐 ' + esc(fmtTimeRange(next)) + (next.arrival ? ' · llegada ' + esc(next.arrival) + ' h' : '') + '</span>' +
        '<span>📍 ' + esc(next.location || 'Ubicación por confirmar') + '</span>' +
        (next.organizer ? '<span>🏛 ' + esc(next.organizer) + '</span>' : '') +
        (next.dressCode ? '<span>👔 ' + esc(next.dressCode) + '</span>' : '') +
      '</div>' +
      '<div class="hero-badges">' + chipsParticipation(next, true) +
        (next.speaks && next.speechType ? '<span class="chip" style="background:rgba(255,255,255,.14);color:#fff">' + esc(next.speechType) + (next.speechDuration && next.speechDuration !== '—' ? ' · ' + esc(next.speechDuration) : '') + '</span>' : '') +
      '</div>' +
      '<div class="hero-actions">' +
        '<button class="btn" data-open="' + next.id + '">Ver ficha completa</button>' +
        (adjunto ? '<button class="btn" data-file="' + esc(adjunto.fileId) + '|' + esc(adjunto.name) + '">📎 Abrir ' + esc(adjunto.name.length > 24 ? 'documentación' : adjunto.name) + '</button>'
                 : briefing ? '<button class="btn" data-doc="' + next.id + '|briefing">📄 Abrir briefing</button>' : '') +
        (next.mapLink || next.address ? '<a class="btn outline" target="_blank" rel="noopener" href="' + esc(next.mapLink || ('https://maps.google.com/?q=' + encodeURIComponent(next.address))) + '">🗺 Cómo llegar</a>' : '') +
      '</div>' +
      (alerts.length ? '<div class="hero-alerts">' + alerts.slice(0, 2).map(a =>
        '<div class="alert">⚠️ <span>' + esc(a.message) + '</span><span class="when">' + esc(fmtRelative(a.ts)) + '</span></div>').join('') + '</div>' : '') +
    '</div>';
  const target = evStart(next);
  function tick(){
    const el = $('#cd-num'); if (!el) return;
    let ms = target - Date.now();
    if (ms < 0) ms = 0;
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4);
    el.textContent = d > 0 ? d + ' d ' + h + ' h' : h + ' h ' + m + ' min';
    $('#cd-lbl').textContent = 'cuenta atrás';
  }
  clearInterval(heroTimer); heroTimer = setInterval(tick, 30000); tick();
}

/* =====================================================
   CALENDARIO (compartido)
   ===================================================== */
function calVisibleEvents(scope){
  let list = events.slice();
  if (scope === 'pres') list = list.filter(presVisible);
  else {
    list = list.filter(pasaAmbito);
    if (state.cal.onlySpeaks) list = list.filter(e => !e.internal && e.attends !== 'no' && e.speaks);
  }
  return list.sort((a, b) => evStart(a) - evStart(b));
}
function renderCalendar(rootId, scope){
  const root = $('#' + rootId);
  const c = state.cal;
  const d = c.date;
  let title;
  if (c.mode === 'month') title = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  else if (c.mode === 'week'){
    const mon = mondayOf(d), sun = new Date(mon.getTime() + 6 * 864e5);
    title = mon.getDate() + ' ' + MONTHS_S[mon.getMonth()] + ' – ' + sun.getDate() + ' ' + MONTHS_S[sun.getMonth()] + ' ' + sun.getFullYear();
  } else title = 'Agenda · próximos 60 días';

  root.innerHTML =
    '<div class="cal-toolbar">' +
      '<div class="cal-nav">' +
        '<button class="btn" data-cal="prev">‹</button>' +
        '<button class="btn" data-cal="today">Hoy</button>' +
        '<button class="btn" data-cal="next">›</button>' +
      '</div>' +
      '<h3>' + esc(title) + '</h3>' +
      '<div class="seg">' +
        ['month|Mes', 'week|Semana', 'agenda|Agenda'].map(x => {
          const [k, l] = x.split('|');
          return '<button data-calmode="' + k + '" class="' + (c.mode === k ? 'active' : '') + '">' + l + '</button>';
        }).join('') +
      '</div>' +
      (scope === 'comms' ?
        '<div class="cal-filters">' +
          '<button class="fchip ' + (c.onlySpeaks ? 'active' : '') + '" data-calf="onlySpeaks">🎤 Interviene</button>' +
        '</div>' : '') +
    '</div>' +
    '<div id="cal-body"></div>' +
    '';

  const body = $('#cal-body', root);
  const list = calVisibleEvents(scope);
  if (c.mode === 'month') body.innerHTML = renderMonth(list);
  else if (c.mode === 'week') body.innerHTML = renderWeek(list);
  else body.innerHTML = renderAgendaList(list);

  $$('[data-cal]', root).forEach(b => b.addEventListener('click', () => {
    const dir = b.dataset.cal;
    if (dir === 'today') c.date = new Date();
    else {
      const step = dir === 'prev' ? -1 : 1;
      if (c.mode === 'week') c.date = new Date(c.date.getTime() + step * 7 * 864e5);
      else c.date = new Date(c.date.getFullYear(), c.date.getMonth() + step, 1);
    }
    renderCalendar(rootId, scope);
  }));
  $$('[data-calmode]', root).forEach(b => b.addEventListener('click', () => { c.mode = b.dataset.calmode; renderCalendar(rootId, scope); }));
  $$('[data-calf]', root).forEach(b => b.addEventListener('click', () => { c[b.dataset.calf] = !c[b.dataset.calf]; renderCalendar(rootId, scope); }));
}
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - (x.getDay() + 6) % 7);
  return x;
}
function calEvChip(ev, cls){
  const warn = (hasOverlap(ev) && isUpcoming(ev) ? ' <span class="w">⏱</span>' : '') + (recentChanges(ev, 7).length ? ' <span class="w">⚠️</span>' : '');
  return '<button class="' + cls + (ev.internal ? ' interno' : ev.attends !== 'no' ? ' pres' : '') + '" style="' + typeColorVars(ev) + '" data-open="' + ev.id + '" title="' + esc(ev.title) + '">' +
    (cls === 'cal-wev' ? '<span class="tm">' + esc(ev.start || '') + '</span><b>' + esc(ev.title) + warn + '</b>' + (ev.speaks && ev.attends !== 'no' ? '🎤 interviene' : '') :
      (ev.start ? esc(ev.start) + ' ' : '') + esc(ev.title) + (ev.speaks && ev.attends !== 'no' ? ' 🎤' : '') + warn) +
  '</button>';
}
function renderMonth(list){
  const d = state.cal.date;
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = mondayOf(first);
  const today = todayISO();
  let html = '<div class="cal-grid">' + DOWS_S.map(x => '<div class="cal-dow">' + x + '</div>').join('');
  for (let i = 0; i < 42; i++){
    const day = new Date(start.getTime() + i * 864e5);
    const iso = day.getFullYear() + '-' + String(day.getMonth() + 1).padStart(2, '0') + '-' + String(day.getDate()).padStart(2, '0');
    const out = day.getMonth() !== d.getMonth();
    const dayEvents = list.filter(e => e.date === iso);
    html += '<div class="cal-cell' + (out ? ' out' : '') + (iso === today ? ' today' : '') + '">' +
      '<div class="dn">' + day.getDate() + '</div>' +
      dayEvents.map(e => calEvChip(e, 'cal-ev')).join('') +
    '</div>';
  }
  html += '</div><div class="cal-grid-mobilenote">En pantallas pequeñas utiliza las vistas <b>Semana</b> o <b>Agenda</b>.</div>';
  return html;
}
function renderWeek(list){
  const mon = mondayOf(state.cal.date);
  const today = todayISO();
  let html = '<div class="cal-week">';
  for (let i = 0; i < 7; i++){
    const day = new Date(mon.getTime() + i * 864e5);
    const iso = day.getFullYear() + '-' + String(day.getMonth() + 1).padStart(2, '0') + '-' + String(day.getDate()).padStart(2, '0');
    const dayEvents = list.filter(e => e.date === iso);
    html += '<div class="cal-wday' + (iso === today ? ' today' : '') + '">' +
      '<div class="cal-wday-h">' + DOWS_S[i] + ' ' + day.getDate() + '</div>' +
      (dayEvents.length ? dayEvents.map(e => calEvChip(e, 'cal-wev')).join('') : '<div style="color:var(--faint);font-size:12px">—</div>') +
    '</div>';
  }
  return html + '</div>';
}
function renderAgendaList(list){
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const lim = new Date(now.getTime() + 60 * 864e5);
  const upcoming = list.filter(e => evStart(e) >= now && evStart(e) <= lim);
  if (!upcoming.length) return '<div class="block-empty">Sin eventos en los próximos 60 días.</div>';
  let html = '<div class="cal-agenda">', lastDate = '';
  upcoming.forEach(e => {
    if (e.date !== lastDate){ lastDate = e.date; html += '<div class="cal-agenda-day">' + esc(fmtDateLong(e.date)) + '</div>'; }
    html += eventCard(e, { showType: true });
  });
  return html + '</div>';
}

/* =====================================================
   DASHBOARD DE COMUNICACIÓN
   ===================================================== */
/* Qué calendario se está mirando: el de todos, el del presidente o el
   interno de Barcelona Global. Vale para la tabla, el calendario y los
   pasados, de modo que las tres pestañas enseñen siempre lo mismo. */
function pasaAmbito(ev){
  const a = state.filters.ambito;
  if (a === 'pres') return !ev.internal;
  if (a === 'interno') return !!ev.internal;
  return true;
}
function hayInternos(){ return events.some(e => e.internal); }
function filteredEvents(opts){
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  const past = !!(opts && opts.past);
  return events.filter(e => {
    if (isUpcoming(e) === past) return false;
    if (!pasaAmbito(e)) return false;
    if (q && !([e.title, e.organizer, e.location, e.address].join(' ')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => evStart(a) - evStart(b));
}
function renderOutlookInfo(){
  const box = $('#outlook-info');
  const btn = $('#btn-import');
  const o = remote.outlook;
  if (!box || !btn) return;
  if (!o || !o.configurado){ box.classList.add('hidden'); btn.classList.add('hidden'); return; }
  btn.classList.remove('hidden');
  box.classList.remove('hidden');
  const u = o.ultima;
  const soloMarcados = o.marca
    ? ' Solo se importan los eventos marcados con «' + o.marca + '» en Outlook' +
      (o.interno ? ', y los marcados con «' + o.interno + '» entran como actos internos de Barcelona Global' : '') + '.'
    : '';
  if (!u){ box.className = 'sync-info'; box.textContent = 'Calendario de Outlook conectado. Se lee cada ' + o.minutos + ' minutos.' + soloMarcados; return; }
  if (!u.ok){
    box.className = 'sync-info err';
    box.textContent = '⚠️ No se pudo leer el calendario de Outlook (' + u.error + '). Último intento: ' + fmtRelative(u.ts) + '.';
    return;
  }
  const r = u.resumen || {};
  box.className = 'sync-info';
  const int = u.interno;
  box.textContent = 'Outlook: ' + u.leidos + (u.marca && u.enCalendario ? ' de ' + u.enCalendario : '') + ' eventos leídos ' +
    (int ? '(y ' + int.leidos + (int.marca && int.enCalendario ? ' de ' + int.enCalendario : '') + ' internos) ' : '') + fmtRelative(u.ts) +
    (r.nuevos ? ' · ' + r.nuevos + ' nuevos' : '') +
    (r.actualizados ? ' · ' + r.actualizados + ' actualizados' : '') +
    (r.desaparecidos ? ' · ' + r.desaparecidos + ' ya no están' : '') +
    '. Se lee cada ' + o.minutos + ' minutos.' + soloMarcados;
}

/* El selector de calendario solo tiene sentido cuando hay actos internos:
   mientras no los haya, no ocupa sitio. Si desaparecen todos, se vuelve
   a «Todo» para no dejar la pantalla vacía sin explicación. */
function renderAmbito(){
  const seg = $('#seg-ambito');
  if (!seg) return;
  const hay = hayInternos();
  if (!hay && state.filters.ambito !== 'todo') state.filters.ambito = 'todo';
  seg.classList.toggle('hidden', !hay);
  $$('button', seg).forEach(b => b.classList.toggle('active', b.dataset.ambito === state.filters.ambito));
}
function renderComms(){
  renderOutlookInfo();
  renderAmbito();
  const incs = computeIncidents();
  $('#inc-count').textContent = incs.length;
  $('#inc-count').style.display = incs.length ? '' : 'none';
  const tab = state.commsTab;
  $('#c-table').classList.toggle('hidden', tab !== 'table');
  $('#c-calendar').classList.toggle('hidden', tab !== 'calendar');
  $('#c-incidents').classList.toggle('hidden', tab !== 'incidents');
  $('#c-past').classList.toggle('hidden', tab !== 'past');
  if (tab === 'table') renderTable();
  else if (tab === 'calendar') renderCalendar('c-cal-root', 'comms');
  else if (tab === 'past') renderPast();
  else renderIncidents(incs);
}
/* Eventos ya celebrados: todos, los del presidente y los internos, del más
   reciente al más antiguo y agrupados por mes. Respeta el buscador. */
function renderPast(){
  const list = filteredEvents({ past: true }).reverse();
  if (!list.length){
    $('#past-root').innerHTML = '<div class="block-empty">' +
      (state.filters.q.trim() ? 'Ningún evento pasado coincide con la búsqueda.' : 'Todavía no hay eventos celebrados.') + '</div>';
    return;
  }
  let html = '<div class="cal-agenda">', lastMonth = '';
  list.forEach(e => {
    const m = e.date.slice(0, 7);
    if (m !== lastMonth){
      lastMonth = m;
      const d = parseDT(e.date, '00:00');
      const mes = MONTHS[d.getMonth()];
      html += '<div class="cal-agenda-day">' + mes.charAt(0).toUpperCase() + mes.slice(1) + ' de ' + d.getFullYear() + '</div>';
    }
    html += eventCard(e, { showType: true });
  });
  $('#past-root').innerHTML = html + '</div>';
}
function renderTable(){
  const list = filteredEvents();
  let html = '<thead><tr>' +
    ['Fecha', 'Evento', ''].map(h => '<th>' + h + '</th>').join('') +
    '</tr></thead><tbody>';
  if (!list.length){
    // Si lo que busca está entre los actos ya celebrados hay que decírselo:
    // de lo contrario parecería que el evento no existe en la agenda.
    const enPasados = filteredEvents({ past: true }).length;
    const aviso = state.filters.q.trim()
      ? 'Ningún evento próximo coincide con la búsqueda.' +
        (enPasados ? (enPasados === 1
          ? ' Hay uno ya celebrado que sí: <button class="lnk" data-ctab-ir="past">verlo en «Pasados»</button>.'
          : ' Hay ' + enPasados + ' ya celebrados que sí: <button class="lnk" data-ctab-ir="past">verlos en «Pasados»</button>.') : '')
      : (state.filters.ambito === 'interno' ? 'No hay actos internos próximos.'
         : state.filters.ambito === 'pres' ? 'No hay actos del presidente próximos.'
         : 'No hay eventos próximos.') + (enPasados ? ' Los ya celebrados están en «Pasados».' : '');
    html += '<tr><td colspan="3" style="text-align:center;color:var(--faint);padding:26px">' + aviso + '</td></tr>';
  }
  list.forEach(e => {
    html += '<tr class="row' + (e.internal ? ' interno' : '') + '">' +
      '<td class="c-fecha" style="white-space:nowrap"><b>' + esc(fmtDateShort(e.date)) + '</b><br><small style="color:var(--muted)">' + esc(ev2time(e)) + '</small></td>' +
      '<td class="c-evento">' +
        '<span class="evt-t" data-open="' + e.id + '">' + esc(e.title) + '</span>' +
        (hasOverlap(e) && isUpcoming(e) ? ' <span class="dot-warn" title="Solapado">⏱</span>' : '') +
        (recentChanges(e, 7).length ? ' <span class="dot-warn" title="Cambios recientes">⚠️</span>' : '') +
        '<br><small style="color:var(--muted)">' + esc(TYPES[e.type].label) + (e.organizer && e.organizer !== 'Barcelona Global' ? ' · ' + esc(e.organizer) : '') + '</small>' +
        (e.internal && state.filters.ambito !== 'interno' ? ' <span class="chip chip-interno" title="Acto interno de Barcelona Global: el presidente no lo ve">Interno BG</span>' : '') +
        (e.origin === 'outlook' && !e.missingFromSource ? ' <span class="chip chip-outlook" title="Este evento viene del calendario de Outlook">Outlook</span>' : '') +
        (e.missingFromSource ? ' <span class="chip chip-status-cancelat" style="text-decoration:none" title="Ya no llega del calendario de Outlook">Ya no está en Outlook</span>' : '') + '</td>' +
      '<td class="c-acciones"><div class="row-actions">' +
        '<button class="iconbtn" title="Editar" data-edit="' + e.id + '">✏️</button>' +
        '<button class="iconbtn" title="Ficha" data-open="' + e.id + '">👁</button>' +
        '<button class="iconbtn danger" title="Eliminar definitivamente" data-del="' + e.id + '">🗑</button>' +
      '</div></td>' +
    '</tr>';
  });
  $('#tbl').innerHTML = html + '</tbody>';
}
function ev2time(e){ return e.start ? e.start + (e.end ? '–' + e.end : '') : '—'; }
function renderIncidents(incs){
  $('#inc-root').innerHTML = incs.length ? incs.map(i =>
    '<div class="inc sev-' + i.sev + '">' +
      '<div class="inc-ico">' + i.ico + '</div>' +
      '<div><b>' + esc(i.title) + '</b><p>' + esc(i.text) + '</p></div>' +
      '<button class="btn btn-sm" data-open="' + i.evId + '">Revisar</button>' +
    '</div>').join('') :
    '<div class="inc-ok">✓ Sin incidencias detectadas. La agenda está en orden.</div>';
}

/* =====================================================
   FICHA DE EVENTO (detalle)
   ===================================================== */
function openDetail(id){
  const e = byId(id); if (!e) return;
  const isComms = state.role === 'comms';
  const briefing = (e.docs || []).find(d => d.kind === 'briefing');
  const docLabels = { briefing: 'Briefing', invitation: 'Invitación', agenda: 'Agenda / escaleta', speech: 'Discurso · talking points', link: 'Enlace', file: 'Archivo adjunto' };

      dit('Interviene', e.attends !== 'no' && e.speaks ? 'Sí' : 'No') +

  let foot = '';

    foot =
      (e.attends !== 'si' ? '<button class="btn" data-act="attend-yes|' + e.id + '">✓ Confirmar asistencia</button>' : '') +

function dit(k, v){ return '<div class="dit"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>'; }

/* ---------- Apertura de un archivo adjunto ---------- */
async function abrirAdjunto(fileId, nombre){
  toast('Abriendo ' + nombre + '…');
  try {
    const r = await fetch('/api/files/' + encodeURIComponent(fileId), { headers: authHeaders() });
    if (r.status === 401){ sessionExpired(); return; }
    if (!r.ok){
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || 'no disponible');
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast('No se pudo abrir el archivo: ' + e.message, 'err'); }
}

/* ---------- Adjuntos en el formulario ---------- */
let adjuntosEnEdicion = [];
const pesoLegible = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
function pintarAdjuntos(){
  const lista = $('#adjuntos-lista');
  const zona = $('#adjuntos-zona');
  if (!lista || !zona) return;
  lista.innerHTML = adjuntosEnEdicion.length
    ? adjuntosEnEdicion.map((d, i) =>
        '<div class="doc-row">📎 <span><b>' + esc(d.name) + '</b>' + (d.size ? ' <small style="color:var(--muted)">' + esc(pesoLegible(d.size)) + '</small>' : '') + '</span>' +
        '<button type="button" class="btn btn-sm btn-danger" data-quita-adj="' + i + '">Quitar</button></div>').join('')
    : '<div style="color:var(--faint);font-size:13px;margin-bottom:8px">Todavía no hay archivos adjuntos.</div>';

  if (!remote.enabled){
    zona.innerHTML = '<div class="alert info">📎 <span>Para adjuntar archivos hay que entrar por la dirección del servidor. En esta versión suelta solo se pueden anotar nombres o enlaces.</span></div>';
    return;
  }
  zona.innerHTML =
    '<input type="file" id="adj-file" class="hidden" multiple ' +
      'accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv">' +
    '<button type="button" class="btn" id="adj-btn">📎 Adjuntar archivo…</button>' +
    '<small style="display:block;color:var(--muted);margin-top:6px">PDF, Word, PowerPoint, Excel, imágenes o texto. Hasta 4 MB por archivo.</small>';
  $('#adj-btn').addEventListener('click', () => $('#adj-file').click());
  $('#adj-file').addEventListener('change', (ev) => subirAdjuntos(Array.from(ev.target.files || [])));
}
async function subirAdjuntos(archivos){
  const btn = $('#adj-btn');
  for (const f of archivos){
    if (btn){ btn.disabled = true; btn.textContent = 'Subiendo ' + f.name + '…'; }
    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1]);
        r.onerror = () => rej(new Error('lectura'));
        r.readAsDataURL(f);
      });
      const r = await fetch('/api/files', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ name: f.name, data: base64 }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'no se pudo subir');
      adjuntosEnEdicion.push({ kind: 'file', name: data.name, fileId: data.id, size: data.size, url: '' });
      toast('Adjuntado: ' + data.name, 'ok');
    } catch (e) { toast('No se pudo adjuntar ' + f.name + ': ' + e.message, 'err'); }
  }
  if (btn){ btn.disabled = false; btn.textContent = '📎 Adjuntar archivo…'; }
  pintarAdjuntos();
}

function fld(label, control, full){
  return '<div class="fld' + (full ? ' full' : '') + '"><label>' + label + '</label>' + control + '</div>';
}
function saveEditor(id){
  const form = $('#ev-form');
  if (!form.reportValidity()) return;
  const fd = new FormData(form);
  const g = (k) => (fd.get(k) || '').toString().trim();
  const prev = id ? byId(id) : null;
  if (id && !prev){ closeModal(); toast('Este evento ya no existe en la base compartida.', 'err'); return; }
  const e = prev || Object.assign(seedBlank(), { id: uid() });

  const antesDocs = prev ? (prev.docs || []).slice() : null;
  const before = prev ? { date: prev.date, start: prev.start, end: prev.end, location: prev.location,
    speaks: prev.speaks, companion: prev.companion, internal: !!prev.internal, briefing: hasDoc(prev, 'briefing') } : null;

  ['title', 'organizer', 'type', 'date', 'start', 'end', 'arrival', 'modality', 'location', 'address', 'mapLink',
   'speechType', 'speechDuration', 'speechLang',
   'dressCode'].forEach(k => { e[k] = g(k); });
  e.internal = g('internal') === 'si';
  e.speaks = e.internal ? false : g('speaks') === 'si';
  e.docs = adjuntosEnEdicion.slice();   // los archivos adjuntos gestionados arriba
  ['briefing', 'invitation', 'agenda', 'speech'].forEach(kind => {
    const name = g('doc_' + kind);
    if (name) e.docs.push({ kind, name, url: '#', updatedAt: before && before.briefing && kind === 'briefing' ? new Date().toISOString() : null });
  });

  if (before){
    if (!before.internal && e.internal) logChange(e, 'El acto pasa al calendario interno: deja de verse en la agenda del presidente.');
    if (before.internal && !e.internal) logChange(e, 'El acto pasa a la agenda del presidente.');
    if (before.date !== e.date) logChange(e, 'La fecha ha cambiado: ahora es el ' + fmtDateShort(e.date) + '.');
    if (before.start !== e.start || before.end !== e.end) logChange(e, 'El horario se ha modificado: ' + fmtTimeRange(e) + '.');
    if (before.location !== e.location) logChange(e, 'La ubicación ha cambiado: ' + (e.location || 'por confirmar') + '.');
    if (!before.speaks && e.speaks) logChange(e, 'Se ha añadido una intervención: ' + (e.speechType || 'por definir') + '.');
    if (before.speaks && !e.speaks) logChange(e, 'Se ha retirado la intervención prevista.');
    if (before.companion !== e.companion && e.companion) logChange(e, 'Cambia la persona que acompaña: ' + e.companion + '.');
    if (!before.briefing && hasDoc(e, 'briefing')) logChange(e, 'Se ha añadido el briefing.');
    else if (before.briefing && hasDoc(e, 'briefing')) { /* posible actualización silenciosa */ }
  }
  // Los adjuntos que se hayan retirado se borran también del servidor
  if (prev && remote.enabled){
    const siguen = new Set(adjuntosEnEdicion.map(d => d.fileId));
    (antesDocs || []).forEach((d) => {
      if (d.fileId && !siguen.has(d.fileId))
        fetch('/api/files/' + encodeURIComponent(d.fileId), { method: 'DELETE', headers: authHeaders() }).catch(() => {});
    });
  }
  if (!prev) events.push(e);
  saveData(); closeModal(); renderAll();
  toast(prev ? 'Evento actualizado.' : 'Evento creado.', 'ok');
}
const esDemo = (e) => e.demo === true || /^ev-0\d{2}$/.test(e.id || '');
function limpiarDemo(){
  const cuantos = events.filter(esDemo).length;
  if (!cuantos){ toast('No quedan eventos de demostración.', 'ok'); return; }
  confirmDialog('¿Vaciar los ' + cuantos + ' eventos de demostración? Los que hayáis creado vosotros y los que llegan de Outlook no se tocan.', () => {
    events = events.filter((e) => !esDemo(e));
    saveData(); renderAll();
    toast(cuantos + ' eventos de demostración eliminados.', 'ok');
  });
}

// Eventos que llegaron de Outlook y ya no llegan: o los han borrado
// allí, o les han quitado la marca.
const esRetirado = (e) => e.origin === 'outlook' && e.missingFromSource === true;
function limpiarRetirados(){
  const lista = events.filter(esRetirado);
  if (!lista.length){ toast('No hay eventos retirados de Outlook.', 'ok'); return; }
  // Se avisa aparte de los que llevan trabajo hecho, para no perderlo sin querer.
  const conTrabajo = lista.filter(e => e.attends === 'si' || (e.docs || []).length || e.speaks);
  const aviso = '¿Retirar de la agenda los ' + lista.length + ' eventos que ya no llegan de Outlook?' +
    (conTrabajo.length
      ? ' Atención: ' + (conTrabajo.length === 1 ? 'uno de ellos tiene' : conTrabajo.length + ' de ellos tienen') + ' asistencia confirmada, intervención o documentación adjunta, y se perderá' + (conTrabajo.length === 1 ? '' : 'n') + ': ' +
        conTrabajo.slice(0, 3).map(e => '«' + e.title + '»').join(', ') + (conTrabajo.length > 3 ? '…' : '') + '.'
      : ' Ninguno tiene trabajo asociado.');
  confirmDialog(aviso, () => {
    if (remote.enabled) lista.forEach((e) => (e.docs || []).forEach((d) => {
      if (d.fileId) fetch('/api/files/' + encodeURIComponent(d.fileId), { method: 'DELETE', headers: authHeaders() }).catch(() => {});
    }));
    const ids = new Set(lista.map(e => e.id));
    events = events.filter(e => !ids.has(e.id));
    saveData(); renderAll();
    toast(lista.length + ' eventos retirados de la agenda.', 'ok');
  });
}
